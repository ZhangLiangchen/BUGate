{
  "apiVersion": "bugate.io/v2",
  "kind": "ProtocolManifest",
  "metadata": {
    "id": "bugate",
    "version": "2.0.0"
  },
  "status": "implemented",
  "schemas": {
    "artifact": "schemas/artifact.schema.json",
    "assessment_request": "schemas/assessment_request.schema.json",
    "assessment_result": "schemas/assessment_result.schema.json",
    "claim": "schemas/claim.schema.json",
    "command_result": "schemas/command_result.schema.json",
    "evidence": "schemas/evidence.schema.json",
    "execution_record": "schemas/execution_record.schema.json",
    "method_spec": "schemas/method_spec.schema.json",
    "prepared_protocol_context": "schemas/prepared_protocol_context.schema.json",
    "profile": "schemas/profile.schema.json",
    "protocol_binding": "schemas/protocol_binding.schema.json",
    "test_task": "schemas/test_task.schema.json"
  },
  "methods": [
    "methods/business_understanding.json",
    "methods/diagnosis.json",
    "methods/execution.json",
    "methods/implementation.json",
    "methods/knowledge.json",
    "methods/test_design.json",
    "methods/testability.json"
  ],
  "rules": "rules/quality.json",
  "reason_codes": "reason_codes.yaml",
  "canonicalization": {
    "domain_separator": "UTF-8 domain then NUL then JSON",
    "json": "sorted object keys, UTF-8, no whitespace, no floating point; integers within JS safe range",
    "object_digest": "exclude top-level digest and request_digest",
    "workspace_snapshot": "task facts and referenced source bytes; excludes claims, assessments, derived outputs and transaction metadata",
    "assurance": "local managed process observation, not hostile-worker authentication"
  }
}
