name: TypeScript + native DSH Agent Team

on:
  push:
  pull_request:

jobs:
  node-dsh:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.9.0"
          cache: npm
      - name: Install locked Node and official DSH dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile the shared core, unified CLI and native plugin
        run: npm run build
      - name: Core, source distribution and owned installation boundaries
        run: |
          npm test
          node scripts/check_distribution.mjs
      - name: Real official DSH runtime and Agent Team
        run: npm run test:runtime
      - name: Build finite Node artifact
        run: |
          node packaging/build.mjs --out-dir "$RUNNER_TEMP/bugate-node-package"
          node scripts/check_distribution.mjs --bundle "$RUNNER_TEMP/bugate-node-package/bugate-deepseek-harness-2.2.0-dev.1.tgz"
          cd "$RUNNER_TEMP/bugate-node-package"
          shasum -a 256 -c SHA256SUMS
      - name: Copy official host runtime outside the denied checkout
        run: |
          mkdir -p "$RUNNER_TEMP/dsh-runtime"
          cd "$RUNNER_TEMP/dsh-runtime"
          npm install --ignore-scripts --save-exact @deepseek-ai/dsh@0.2.2-alpha.2 pnpm@11.28.5
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Installed lifecycle and runtime with OS source and Python denial
        run: |
          node tests/integration_install/accept_package.mjs \
            --package "$RUNNER_TEMP/bugate-node-package/bugate-deepseek-harness-2.2.0-dev.1.tgz" \
            --dsh "$RUNNER_TEMP/dsh-runtime/node_modules/.bin/dsh" \
            --dsh-modules "$RUNNER_TEMP/dsh-runtime/node_modules" \
            --pnpm-module "$RUNNER_TEMP/dsh-runtime/node_modules/pnpm/bin/pnpm.mjs" \
            --out-dir "$RUNNER_TEMP/bugate-node-acceptance" \
            --deny-source-root "$GITHUB_WORKSPACE" \
            --runtime-runner adapters/deepseek-harness/tests/standalone-node-runner.mjs \
            --runtime-files standalone-node-runner.mjs,host.mjs,workflow-node.mjs,installed-profile.mjs,team-fixture.mjs,team-negative.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bugate-node-package-and-acceptance
          path: |
            ${{ runner.temp }}/bugate-node-package
            ${{ runner.temp }}/bugate-node-acceptance/*.json
            ${{ runner.temp }}/bugate-node-acceptance/*.stdout
            ${{ runner.temp }}/bugate-node-acceptance/*.stderr
            ${{ runner.temp }}/bugate-node-acceptance/*.sb
          retention-days: 14
