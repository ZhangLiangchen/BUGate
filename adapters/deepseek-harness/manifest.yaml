apiVersion: bugate.io/host/v1
kind: HostAdapterManifest

host:
  id: deepseek-harness
  label: DeepSeek Harness

availability: reserved

install:
  kind: plugin

projections:
  - role: plugin
    path: adapters/deepseek-harness/plugin
  - role: skill
    path: generated-by-projection-compiler

capabilities:
  protocol_discovery:
    status: reserved
  workspace_discovery:
    status: reserved
  protocol_binding:
    status: reserved
  prepared_protocol_context:
    status: reserved
  automatic_hydration:
    status: reserved
    rationale: HyperTest/DeepSeek Harness contract is not stable yet.
  session_rehydration:
    status: reserved
  compaction_rehydration:
    status: reserved
  subagent_inheritance:
    status: reserved
  skill_projection:
    status: reserved
  explicit_assessment:
    status: reserved
  diagnostics:
    status: reserved
  rollback:
    status: reserved
  context_runtime_hydration:
    status: reserved
